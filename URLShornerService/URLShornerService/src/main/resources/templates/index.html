<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>URL Shortener</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f4; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        form { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #218838; }
        .result { margin-top: 20px; padding: 15px; background-color: #e9ecef; border-radius: 4px; }
        .result h2 { margin-top: 0; color: #495057; }
        .result p { margin: 5px 0; }
        .result a { color: #007bff; text-decoration: none; }
        .result a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>URL Shortener</h1>
        <form th:action="@{/shorten}" th:object="${shortenUrlRequest}" method="post">
            <label for="url">Enter URL to shorten:</label>
            <input type="text" id="url" th:field="*{url}" placeholder="https://example.com" required />
            <button type="submit">Shorten URL</button>
        </form>
        <div th:if="${response}" class="result">
            <h2>Shortened URL:</h2>
            <p><strong>Original URL:</strong> <span th:text="${response.originalUrl}"></span></p>
            <p><strong>Shortened URL:</strong> <a th:href="${response.shortUrl}" th:text="${response.shortUrl}" target="_blank"></a></p>
            <p><strong>Short Code:</strong> <span th:text="${response.shortcode}"></span></p>
            <p><strong>Created At:</strong> <span th:text="${response.createdAt}"></span></p>
            <p th:if="${response.expiresAt}"><strong>Expires At:</strong> <span th:text="${response.expiresAt}"></span></p>
        </div>
    </div>
</body>
</html>
